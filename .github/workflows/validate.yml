name: Validate KLAVA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_failure_notification:
        description: "Controlled failure solely to verify Slack failure alerts; does not modify application code"
        type: boolean
        required: false
        default: false
  # 05:00 UTC = 09:00 Asia/Tbilisi; schedules operate on the default branch only.
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  tests:
    name: Python syntax, Ruff, pytest, resource links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pillow==11.3.0

      - name: Validate Python syntax
        run: python -m compileall -q main.py trainer.py logic ui exercises scripts tests

      - name: Check static code issues
        run: ruff check .

      - name: Run regression tests
        run: python -m pytest -q

      - name: Audit canonical Markdown links
        run: python scripts/check_resource_links.py

  failure-notification-test:
    name: Controlled notification path verification
    # Only a manual run explicitly opting in may produce this intentional failure.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_failure_notification == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger intentionally failed check for alert testing
        run: |
          echo "::error::Intentional CI failure to verify Slack webhook notification; no application files modified."
          exit 1
