# KLAVA development-tool configuration.
# CI gate: syntax, correctness, likely-bug and security Ruff rules.
# Import/style modernization (I, UP, SIM) is a separate reviewed task;
# this avoids unrelated changes to the working Trainer/UI baseline.

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# B: likely bugs, ARG: unused arguments, S: security (bandit), BLE: blind except.
select = ["E4", "E7", "E9", "F", "B", "ARG", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
# pytest uses assert; tests start the app in subprocesses and use temp paths.
"tests/**" = ["S101", "S603", "S108"]
